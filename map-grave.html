<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07070a"><title>Grave — UNDEATH KNIGHT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:Arial,sans-serif;touch-action:none}.game{position:relative;width:100%;height:100%;overflow:hidden;background:#08070a}.game:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 20%,rgba(0,0,0,.5) 70%,rgba(0,0,0,.86));z-index:3;pointer-events:none;transition:opacity .5s}.boss-dark{position:absolute;inset:0;z-index:4;pointer-events:none;background:rgba(10,0,4,.32);opacity:0;transition:opacity .6s}.game.boss-mode:before{opacity:.95}.game.boss-mode .boss-dark{opacity:1}.game.boss-mode .canvas{filter:brightness(.62) saturate(.75) contrast(1.08)}.canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;background:#141117 center/cover no-repeat;transition:filter .6s}.grain{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.1;background-image:radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 1.2px);background-size:6px 6px;mix-blend-mode:screen}.dust{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}.dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:#d6c7ae;opacity:.12;filter:blur(1px);animation:drift linear infinite}@keyframes drift{from{transform:translate3d(-15vw,8vh,0) scale(.5);opacity:0}15%{opacity:.14}50%{opacity:.08}100%{transform:translate3d(115vw,-8vh,0) scale(1.2);opacity:0}}
.hud{position:absolute;inset:0;z-index:10;pointer-events:none}.top{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.panel{background:rgba(7,6,9,.66);border:1px solid rgba(210,180,190,.22);backdrop-filter:blur(8px);box-shadow:0 5px 30px rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;color:#efe8eb}.tiny{font-size:10px;color:#b7aab0;letter-spacing:.1em}.hp{width:min(290px,28vw);height:11px;background:#281116;border:1px solid #513039;border-radius:99px;overflow:hidden}.hp>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9c2239,#eb4666);box-shadow:0 0 15px rgba(231,63,92,.3);transition:.2s}.row{display:flex;align-items:center;gap:8px}.shop-btn{pointer-events:auto;border:1px solid #7a5160;background:#1a0f14;color:#f1dbe0;border-radius:8px;padding:8px 12px;font-weight:800}.bossbar{position:absolute;top:74px;left:50%;transform:translateX(-50%);width:min(540px,64vw);display:none}.boss-mode .bossbar{display:block}.bossbar .hp{width:100%}.controls{position:absolute;left:15px;right:15px;bottom:15px;display:flex;justify-content:space-between;align-items:flex-end}.joy{pointer-events:auto;width:128px;height:128px;border-radius:50%;border:2px solid rgba(255,255,255,.16);background:rgba(0,0,0,.24);box-shadow:inset 0 0 20px rgba(255,255,255,.05)}.knob{width:54px;height:54px;border-radius:50%;background:rgba(208,187,192,.32);border:2px solid rgba(255,255,255,.25);transform:translate(35px,35px)}.attack{pointer-events:auto;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 30%,#633143,#170a10 68%);border:2px solid #9e5a6f;box-shadow:0 0 25px rgba(180,50,82,.22);font-size:11px;font-weight:800}.skills{display:flex;gap:8px;margin-left:auto;margin-right:14px}.skill{pointer-events:auto;position:relative;width:62px;height:62px;border-radius:12px;background:rgba(12,9,14,.74);border:1px solid rgba(220,190,200,.22);display:grid;place-items:center;overflow:hidden}.skill img{max-width:75%;max-height:75%;image-rendering:pixelated}.skill b{position:absolute;right:4px;top:3px;font-size:9px;color:#f3cbd3}.cd{position:absolute;inset:auto 0 0 0;height:0;background:rgba(0,0,0,.63);transition:.1s}.toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);padding:10px 14px;border:1px solid rgba(255,255,255,.14);background:rgba(8,5,8,.72);border-radius:99px;opacity:0;transition:.25s}.toast.show{opacity:1}.shop{pointer-events:auto;position:absolute;inset:12% 15%;z-index:20;background:rgba(8,6,9,.96);border:1px solid #60414d;border-radius:16px;padding:18px;display:none;box-shadow:0 20px 80px rgba(0,0,0,.75)}.shop.open{display:block}.shop-head{display:flex;justify-content:space-between}.close{border:1px solid #6d4754;background:#160d12;color:#f3dce1;border-radius:8px;padding:7px 11px}.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.item{padding:12px;border:1px solid #423038;background:#120b10;border-radius:12px}.item button{width:100%;margin-top:8px}.price{color:#e7bdc7;font-weight:800}.portrait{display:none;position:fixed;z-index:100;inset:0;background:#09070a;color:#fff;place-items:center;text-align:center;padding:30px}.portrait div{border:1px solid #54424a;background:#120d11;padding:24px;border-radius:15px}.portrait b{font-size:60px;display:block;color:#be8090}@media(orientation:portrait){.portrait{display:grid}.game{display:none}}
</style>
</head>
<body>
<div class="portrait"><div><b>↻</b><h3>ROTATE TO LANDSCAPE</h3><p>Grave is designed for landscape play.</p></div></div>
<div class="game" id="game"><canvas id="canvas" class="canvas"></canvas><div class="boss-dark"></div><div class="grain"></div><div class="dust" id="dust"></div>
<div class="hud"><div class="top"><div class="panel"><div class="row"><strong id="level">LV 1</strong><div class="hp"><i id="hpFill"></i></div><span id="hpText">400/400</span></div><div class="tiny" style="margin-top:5px">XP <span id="xpText">0/100</span></div></div><div class="panel"><span class="tiny">KILLS</span> <b id="kills">0</b>/100 &nbsp; <span class="tiny">COINS</span> <b id="coins">0</b> <button class="shop-btn" id="shopBtn">SHOP</button></div></div>
<div class="panel bossbar" id="bossbar"><div class="row" style="justify-content:space-between"><b id="bossName">BIG ZOMBIE</b><span id="bossHpText">0/0</span></div><div class="hp"><i id="bossFill"></i></div></div>
<div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="attack" id="attack">TAP / HOLD<br>BASIC ATTACK</div><div class="skills"><div class="skill" id="s1"><img src="assets/ui/skull.png" onerror="this.style.opacity=.25"><b>1</b><div class="cd"></div></div><div class="skill" id="s2"><img src="assets/ui/sword.png" onerror="this.style.opacity=.25"><b>2</b><div class="cd"></div></div><div class="skill" id="s3"><img src="assets/ui/shield.png" onerror="this.style.opacity=.25"><b>3</b><div class="cd"></div></div><div class="skill" id="ult"><img src="assets/sprites/dark_wings.png" onerror="this.style.opacity=.25"><b>ULT</b><div class="cd"></div></div></div></div>
<div class="toast" id="toast"></div><div class="shop" id="shop"><div class="shop-head"><div><b style="font:900 28px Georgia">BLACK MARKET</b><div class="tiny">COINS: <span id="shopCoins">0</span></div></div><button class="close" id="shopClose">X</button></div><div class="shop-grid" id="shopGrid"></div></div>
</div></div>
<script>
(()=>{
const game=document.getElementById('game'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const bg=new Image();bg.src='assets/maps/grave_tile.png';let bgReady=false;bg.onload=()=>{bgReady=true;};
const W=()=>innerWidth,H=()=>innerHeight;function resize(){canvas.width=W()*devicePixelRatio;canvas.height=H()*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const player={x:0,y:0,hp:400,maxHp:400,atk:46,level:1,xp:0,coins:0,angle:0,attackCd:0,dash:0,inv:0,lifesteal:0,buffs:[]};let mobs=[],boss=null,kills=0,last=performance.now(),spawnT=0,joy={x:0,y:0,on:false},holdStart=0,holding=false,cooldowns={s1:0,s2:0,s3:0,ult:0};
const dust=document.getElementById('dust');for(let i=0;i<26;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.animationDuration=(6+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*12)+'s';p.style.opacity=(.06+Math.random()*.14).toFixed(2);dust.appendChild(p)}
const txt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1200)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(){const a=Math.random()*Math.PI*2,r=350+Math.random()*260;mobs.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp:90,max:90,spd:32+Math.random()*20,hit:0})}
function damage(m,d){if(!m)return;m.hp-=d;if(m.hp<=0){const i=mobs.indexOf(m);if(i>=0)mobs.splice(i,1);kills++;player.coins+=5;player.xp+=20;if(player.xp>=100){player.level++;player.xp=0;player.maxHp+=45;player.hp=player.maxHp;player.atk+=8;toast('LEVEL UP!')}if(kills%100===0&&!boss)startBoss();}}
function startBoss(){boss={x:player.x+220,y:player.y-60,hp:2200,max:2200,spd:18};game.classList.add('boss-mode');toast('BIG ZOMBIE HAS AWAKENED')}
function damageBoss(d){if(!boss)return;boss.hp-=d;if(boss.hp<=0){boss=null;game.classList.remove('boss-mode');toast('BOSS DEFEATED!');}}
function autoAttack(){if(player.attackCd>0)return;player.attackCd=.34;let target=null,md=170;for(const m of mobs){const d=dist(m,player);if(d<md){md=d;target=m}}if(target)damage(target,player.atk);if(boss&&dist(boss,player)<190)damageBoss(player.atk)}
function dash(){if(player.attackCd>0)return;player.attackCd=.55;const sx=player.x,sy=player.y,dx=Math.cos(player.angle),dy=Math.sin(player.angle),ex=sx+dx*250,ey=sy+dy*250;player.x=ex;player.y=ey;for(const m of [...mobs]){const px=m.x-sx,py=m.y-sy,l=dx*px+dy*py;const cx=sx+clamp(l,0,250)*dx,cy=sy+clamp(l,0,250)*dy;if(Math.hypot(m.x-cx,m.y-cy)<75)damage(m,player.atk*1.8)}if(boss){const px=boss.x-sx,py=boss.y-sy,l=clamp(dx*px+dy*py,0,250),cx=sx+l*dx,cy=sy+l*dy;if(Math.hypot(boss.x-cx,boss.y-cy)<105)damageBoss(player.atk*1.25)}}
function skill(id){if(cooldowns[id]>0)return;cooldowns[id]=id==='s1'?8:id==='s2'?6:id==='s3'?10:16;if(id==='s1'){for(let i=0;i<2;i++){mobs.push({x:player.x+(i?24:-24),y:player.y-35,hp:120,max:120,spd:55,hit:0,summon:5})}toast('2 SHADOW ZOMBIES SUMMONED')}else if(id==='s2'){for(const m of [...mobs])if(dist(m,player)<230)damage(m,player.atk*2.2);if(boss&&dist(boss,player)<260)damageBoss(player.atk*1.7);toast('VOID CLEAVE')}else if(id==='s3'){player.inv=2.2;player.hp=Math.min(player.maxHp,player.hp+100);toast('DEATH WARD')}else{player.inv=10;player.lifesteal=.2;player.atk*=1.7;game.classList.add('boss-mode');for(let i=0;i<10;i++)mobs.push({x:player.x+(Math.random()-.5)*150,y:player.y+(Math.random()-.5)*150,hp:120,max:120,spd:55,hit:0,summon:5});toast('UNDEATH ASCENSION')}}
function update(dt){player.attackCd=Math.max(0,player.attackCd-dt);player.inv=Math.max(0,player.inv-dt);for(const k in cooldowns)cooldowns[k]=Math.max(0,cooldowns[k]-dt);if(player.inv===0&&player.lifesteal>0){player.lifesteal=0;player.atk=46+8*(player.level-1)}
let mx=joy.x,my=joy.y;if(Math.hypot(mx,my)>.08){const l=Math.hypot(mx,my);mx/=l;my/=l;player.x+=mx*150*dt;player.y+=my*150*dt;player.angle=Math.atan2(my,mx)}for(const m of [...mobs]){if(m.summon){m.summon-=dt;if(m.summon<=0){const i=mobs.indexOf(m);if(i>=0)mobs.splice(i,1);continue}}const dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy)||1;m.x+=dx/d*m.spd*dt;m.y+=dy/d*m.spd*dt;if(d<34&&m.hit<=0&&player.inv<=0){player.hp-=10;m.hit=.8}}if(boss){const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;boss.x+=dx/d*boss.spd*dt;boss.y+=dy/d*boss.spd*dt;if(d<48&&player.inv<=0)player.hp-=18*dt}spawnT-=dt;if(spawnT<=0&&!boss){spawn();spawnT=.45}if(player.hp<=0){player.hp=player.maxHp;kills=0;player.x=0;player.y=0;toast('THE KNIGHT RISES AGAIN')}renderHud()}
function drawSprite(o,color,size){ctx.save();ctx.translate(W()/2+o.x-player.x,H()/2+o.y-player.y);ctx.rotate(o===player?player.angle:0);ctx.fillStyle=color;ctx.fillRect(-size/2,-size/2,size,size);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(-size*.18,-size*.35,size*.36,size*.14);ctx.restore()}
function render(){const w=W(),h=H();ctx.clearRect(0,0,w,h);if(bgReady){const scale=Math.max(w/bg.naturalWidth,h/bg.naturalHeight);const iw=bg.naturalWidth*scale,ih=bg.naturalHeight*scale;ctx.globalAlpha=.98;ctx.drawImage(bg,(w-iw)/2,(h-ih)/2,iw,ih);ctx.globalAlpha=1}else{const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#211923');g.addColorStop(1,'#08070a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}for(const m of mobs)drawSprite(m,'#4a5b4a',28);if(boss)drawSprite(boss,'#273629',58);drawSprite(player,'#4b1423',40);if(player.inv>0){ctx.beginPath();ctx.strokeStyle='rgba(195,91,217,.7)';ctx.lineWidth=5;ctx.arc(w/2,h/2,35,0,Math.PI*2);ctx.stroke()}}
function renderHud(){txt('level','LV '+player.level);document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';txt('hpText',Math.ceil(player.hp)+'/'+player.maxHp);txt('xpText',player.xp+'/100');txt('kills',kills);txt('coins',player.coins);txt('shopCoins',player.coins);if(boss){document.getElementById('bossFill').style.width=(boss.hp/boss.max*100)+'%';txt('bossHpText',Math.ceil(boss.hp)+'/'+boss.max)}document.querySelectorAll('.skill').forEach(el=>{const id=el.id,cd=cooldowns[id]||0;el.querySelector('.cd').style.height=(cd?Math.min(100,cd/16*100):0)+'%'})}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function joyStart(e){joy.on=true;moveJoy(e)}function joyMove(e){if(!joy.on)return;const r=document.getElementById('joy').getBoundingClientRect();joy.x=(e.clientX-(r.left+r.width/2))/(r.width/2);joy.y=(e.clientY-(r.top+r.height/2))/(r.height/2);const l=Math.hypot(joy.x,joy.y);if(l>1){joy.x/=l;joy.y/=l}document.getElementById('knob').style.transform=`translate(${35+joy.x*30}px,${35+joy.y*30}px)`}function joyEnd(){joy.on=false;joy.x=joy.y=0;document.getElementById('knob').style.transform='translate(35px,35px)'}document.getElementById('joy').addEventListener('pointerdown',joyStart);addEventListener('pointermove',joyMove);addEventListener('pointerup',joyEnd);
const atk=document.getElementById('attack');atk.onpointerdown=e=>{holding=true;holdStart=performance.now();atk.setPointerCapture(e.pointerId)};atk.onpointerup=()=>{const held=(performance.now()-holdStart)>320;holding=false;held?dash():autoAttack()};
['s1','s2','s3','ult'].forEach(id=>document.getElementById(id).onclick=()=>skill(id));document.getElementById('shopBtn').onclick=()=>document.getElementById('shop').classList.add('open');document.getElementById('shopClose').onclick=()=>document.getElementById('shop').classList.remove('open');
const items=[['Blood Charm',30,()=>{player.maxHp+=100;player.hp+=100} ],['Grave Blade',45,()=>player.atk+=18],['Soul Leech',60,()=>player.lifesteal=Math.max(player.lifesteal,.15)]];const grid=document.getElementById('shopGrid');for(const [n,p,fn] of items){const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${n}</b><div class="tiny" style="margin-top:5px">POWER UPGRADE</div><div class="price" style="margin-top:7px">${p} COINS</div><button class="close">BUY</button>`;d.querySelector('button').onclick=()=>{if(player.coins>=p){player.coins-=p;fn();toast(n+' purchased');renderHud()}else toast('Not enough coins')};grid.appendChild(d)}
})();
</script>
</body></html>
