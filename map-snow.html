<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Snow Mountain — UNDEATH KNIGHT</title><link rel="stylesheet" href="css/style.css"></head><body><div class="portrait-lock"><div><div class="rotate">↻</div><h2>ROTATE TO LANDSCAPE</h2><p>UNDEATH KNIGHT is designed for landscape play.</p></div></div><div class="game-wrap"><canvas id="game" class="game-canvas"></canvas><div class="hud"><div class="topbar"><div class="barbox"><div style="display:flex;gap:9px;align-items:center"><span id="level">LV 1</span><div class="hpbar"><div class="hpfill" id="hp"></div></div><span id="hpText">400/400</span></div><div style="margin-top:4px;font-size:11px">XP <span id="xpText">0/100</span></div></div><div class="barbox"><span>KILLS <b id="kills">0</b>/100</span> &nbsp; • &nbsp; <span>COINS <b id="coins">0</b></span> &nbsp; <button class="close" id="shopBtn">SHOP</button></div></div><div class="bossbar barbox" id="bossbar"><div style="display:flex;justify-content:space-between;font-size:11px"><span id="bossName">BOSS</span><span id="bossHpText"></span></div><div class="hpbar"><div class="hpfill" id="bossHp"></div></div></div><div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="attack-zone" id="attack"><span>TAP / HOLD<br>BASIC ATTACK</span></div><div class="skillbar"><div class="skill" id="s1"><img src="assets/ui/skull.png"><b>1</b><div class="cd"></div></div><div class="skill" id="s2"><img src="assets/ui/sword.png"><b>2</b><div class="cd"></div></div><div class="skill" id="s3"><img src="assets/ui/shield.png"><b>3</b><div class="cd"></div></div><div class="skill" id="ult"><img src="assets/sprites/dark_wings.png"><b>ULT</b><div class="cd"></div></div></div></div><div class="toast" id="toast"></div><div class="shop" id="shop"><div class="shop-head"><div><div class="titlefont" style="font-size:36px">BLACK MARKET</div><div class="small muted">Coins: <span id="shopCoins">0</span></div></div><button class="close" id="shopClose">X</button></div><div class="shop-grid" id="shopGrid"></div><div class="small muted" style="margin-top:12px">Purchased items apply immediately. Stackable upgrades remain after returning to the battlefield.</div></div></div></div><script src="js/engine.js"></script></body></html>
