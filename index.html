<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#130308">
<title>UNDEATH KNIGHT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080307;color:#eee;font-family:Georgia,'Times New Roman',serif;touch-action:none}body{min-height:100dvh}.landscape-lock{display:none;position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#3c0e17,#090205 65%);align-items:center;justify-content:center;text-align:center;padding:28px}.landscape-lock .card{border:1px solid #8f3248;background:rgba(12,2,6,.85);box-shadow:0 0 50px rgba(173,34,70,.3);padding:28px 32px;border-radius:16px}.rotate{font-size:62px;animation:spin 2.8s linear infinite;color:#ea5870}.landscape-lock h2{margin:8px 0;color:#f3b3bf;letter-spacing:4px;font-size:clamp(18px,4vw,30px)}.landscape-lock p{margin:0;color:#c18d99;font-family:Arial,sans-serif}@media(orientation:portrait){.landscape-lock{display:flex}.start-screen{display:none!important}}
.start-screen{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,rgba(26,0,7,.72),rgba(5,0,3,.93)),url('https://files.catbox.moe/ilcs68.png') center/cover no-repeat;isolation:isolate}.start-screen:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 34%,rgba(255,64,96,.22),transparent 18%),radial-gradient(circle at 50% 75%,rgba(105,0,22,.26),transparent 35%);filter:blur(18px);animation:breath 5s ease-in-out infinite;z-index:-1}.start-screen:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,150,168,.05) 48%,transparent 58%);background-size:220% 100%;animation:sweep 8s linear infinite;pointer-events:none}.vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 28%,rgba(0,0,0,.2) 58%,rgba(0,0,0,.82) 100%);pointer-events:none}.content{position:relative;z-index:2;text-align:center;padding:3vh 5vw}.eyebrow{font-family:Arial,sans-serif;font-size:clamp(10px,1.3vw,16px);letter-spacing:.48em;color:#d59ca8;margin-bottom:1.5vh}.title{margin:0;color:#f2d9dd;font-weight:900;line-height:.84;letter-spacing:.04em;font-size:clamp(64px,11vw,170px);text-shadow:0 0 7px #fff1f2,0 0 25px #d5234d,0 0 70px rgba(138,12,35,.8);animation:titlePulse 4s ease-in-out infinite}.title span{display:block;color:#d52d4e;text-shadow:0 0 10px #ff5875,0 0 34px rgba(164,16,45,.95)}.subtitle{font-family:Arial,sans-serif;font-size:clamp(10px,1.35vw,15px);letter-spacing:.24em;color:#c7aab0;margin-top:2.6vh}.start{margin:6vh auto 0;border:1px solid #a63751;background:linear-gradient(180deg,rgba(112,19,37,.58),rgba(42,6,14,.78));color:#f6d8de;padding:16px 30px;border-radius:999px;min-width:280px;font-family:Arial,sans-serif;font-weight:800;letter-spacing:.2em;box-shadow:0 0 20px rgba(203,42,76,.25),inset 0 0 30px rgba(255,115,139,.04);cursor:pointer;animation:buttonGlow 2.4s ease-in-out infinite}.credit{margin-top:2.4vh;font:600 12px Arial,sans-serif;letter-spacing:.25em;color:#9a7780}.hint{position:absolute;left:50%;bottom:2.6vh;transform:translateX(-50%);color:#8c6b74;font:11px Arial,sans-serif;letter-spacing:.12em;white-space:nowrap}.audio-dot{position:absolute;right:20px;top:20px;width:11px;height:11px;border-radius:50%;background:#e33c5c;box-shadow:0 0 18px #e33c5c;opacity:.8}
@keyframes breath{50%{transform:scale(1.08);opacity:.8}}@keyframes sweep{to{background-position:-220% 0}}@keyframes titlePulse{50%{transform:translateY(-3px) scale(1.012)}}@keyframes buttonGlow{50%{box-shadow:0 0 35px rgba(217,42,82,.42),inset 0 0 30px rgba(255,115,139,.06)}}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="landscape-lock"><div class="card"><div class="rotate">↻</div><h2>ROTATE TO LANDSCAPE</h2><p>UNDEATH KNIGHT is designed for widescreen play.</p></div></div>
<main class="start-screen" id="screen"><div class="vignette"></div><div class="audio-dot"></div><section class="content"><div class="eyebrow">A DARK FANTASY PIXEL OPEN WORLD</div><h1 class="title"><span>UNDEATH</span>KNIGHT</h1><div class="subtitle">RISE • HUNT • DEFY DEATH</div><button class="start" id="start">PRESS ANYWHERE TO START</button><div class="credit">CREDIT: ZEPARDON DECODE</div></section><div class="hint">Landscape recommended • Audio ambience enabled on start</div></main>
<audio id="menuAudio" src="https://files.catbox.moe/h33zn9.mp3" loop preload="auto"></audio>
<script>
const audio=document.getElementById('menuAudio');let launched=false;
async function launch(){if(launched)return;launched=true;try{await audio.play()}catch(e){}try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}sessionStorage.setItem('menuStarted','1');location.href='map-select.html'}
document.addEventListener('pointerdown',launch,{once:true});document.addEventListener('keydown',launch,{once:true});
</script>
</body></html>
